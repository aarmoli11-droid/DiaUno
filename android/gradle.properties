org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The destination folder contains a non-ASCII character ("í" in DíaUno).
# AGP blocks it by default on Windows; the build itself is UTF-8 safe.
# See README.md for details and the ASCII-path fallback.
android.overridePathCheck=true
